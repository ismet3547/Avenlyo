name: CI

on:
  pull_request:
    branches: [main, feat/dynamic-website-knowledge]
  push:
    branches: [main, feat/dynamic-website-knowledge]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  rendered-browser-security:
    name: Rendered browser security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The rendered import runs hostile third-party JavaScript, so its confinement has to be proven
    # by a real browser rather than skipped. This job installs Chromium and fails if it is absent:
    # a silent skip here would mean the WebRTC, private-address, navigation, and resource-bound
    # regressions never ran. It is separate so the ordinary application job stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright-core never downloads a browser, so the binary is provided explicitly here and
      # nowhere else. Ordinary installs and the application job stay free of a Chromium download.
      - name: Install Chromium
        run: pnpm --filter @avenlyo/api exec playwright-core install --with-deps chromium

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and unprivileged user
      # namespaces are exactly what Chromium's sandbox needs to build its own as a non-root user.
      # Without this the sandboxed launch fails on the runner -- and the tempting fix, dropping the
      # sandbox, is the defect this job now exists to catch. So the host capability is enabled and
      # CI runs the same launch configuration production does, sandbox included.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: |
          # Tolerant of the key being absent: which of the two knobs exists is a kernel and
          # distribution detail, and an image that already permits this needs neither. Whether the
          # sandbox actually works is then decided by the suite launching a browser, not by these.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"

      - name: Require a usable Chromium
        run: pnpm --filter @avenlyo/api exec node --input-type=module -e "import { chromium } from 'playwright-core'; import { existsSync } from 'node:fs'; const path = chromium.executablePath(); if (!existsSync(path)) { console.error('Chromium is required for the rendered browser security suite.'); process.exit(1); } console.log('Chromium present.');"

      # Every case here launches through the production launch options, sandbox included, against
      # loopback fixtures: no public website, no DNS, and certificate errors are never ignored. A
      # host that cannot start a sandboxed Chromium fails this job rather than falling back, because
      # falling back is what put unsandboxed hostile JavaScript in the worker process.
      - name: Rendered browser security suite
        run: pnpm vitest run --config vitest.chromium.config.ts --reporter=verbose

      # A skipped security test is a security test that did not run. The suite is required to
      # execute every case, so the guard fails the job if any were skipped.
      - name: Fail if any rendered security test was skipped
        run: pnpm vitest run --config vitest.chromium.config.ts --reporter=json --outputFile=rendered-report.json && node -e "const r=require('./rendered-report.json'); const notRun=r.testResults.flatMap(f=>f.assertionResults).filter(a=>a.status!=='passed'); if(notRun.length||!r.numTotalTests){console.error('Rendered security tests did not all run:', notRun.map(a=>a.title)); process.exit(1);} console.log('All', r.numTotalTests, 'rendered tests executed.');"

  database-security:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned rather than floating. "latest" silently moved from v2.115.0 to v2.116.0 between
      # two runs of an unchanged schema, and v2.116.0 restored the hosted platform's
      # auto_expose_new_tables default -- which this suite promptly caught as fourteen real
      # privilege failures. A security gate whose toolchain can change underneath it reports
      # findings on a schedule nobody chose, so the version moves when someone reviews it.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: pnpm db:reset

      - name: Run pgTAP security tests
        run: pnpm db:test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  api-production-artifact:
    name: API production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Proves apps/api's real production build -- not `tsx src/server.ts` -- boots under plain Node
    # and shuts down cleanly. No Docker needed for this job; it is the pnpm/Node-only half of the
    # infra validation, kept separate from the Docker-dependent job below so it stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the API production bundle
        run: pnpm --filter @avenlyo/api build

      # ops-status is listed because it was missing: the runbook and package.json both told
      # operators to run it, and the production image -- which copies dist/ and ships no tsx -- had
      # no artifact for it. Asserting the file exists is the cheap half; the smoke below runs it.
      - name: Confirm the bundle exists
        run: |
          test -f apps/api/dist/server.js
          test -f apps/api/dist/scripts/chromium-sandbox-smoke.js
          test -f apps/api/dist/scripts/ops-status.js

      - name: Artifact boot smoke -- plain Node, /health/live, graceful SIGTERM
        run: pnpm --filter @avenlyo/api smoke:artifact

      - name: Operator status artifact smoke -- plain Node, bounded output, no secrets
        run: pnpm --filter @avenlyo/api smoke:ops-status

  hetzner-staging-containers:
    name: Hetzner staging container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Docker-dependent half. Everything here goes through deploy/compose.yaml itself -- the same
    # --env-file, the same `docker compose build` / `up` / `exec` a real deploy uses -- rather than
    # hand-copying its security_opt/init/shm_size arguments into separate `docker run` commands.
    # A prior version of this job did copy them, and that only proved the image plus a manually
    # re-typed set of flags; it did not prove deploy/compose.yaml's api service definition itself,
    # including whether `security_opt: [seccomp:./chromium-seccomp.json]` even resolves correctly
    # from Compose's own working directory. This version execs the sandbox smoke inside the actual
    # `docker compose up` service instead, so it does.
    env:
      # The exact commit SHA under test -- matches how a real deploy tags images (see
      # docs/deployment/hetzner-staging.md's "Release identifier"), and is what "SHA-tagged images
      # are produced" below actually checks for, not an assumed/synthetic tag.
      AVENLYO_RELEASE: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same finding as the existing "Rendered browser security" job: Ubuntu 24.04 runners restrict
      # unprivileged user namespaces through AppArmor, which is exactly what Chromium's sandbox needs
      # to build its own as a non-root user. This is a host (runner) kernel setting, independent of
      # Docker's own seccomp profile, and containers share the host kernel -- so it has to be set
      # here too, once, before any container that launches Chromium runs.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"

      # Three placeholder files, none committed, none real configuration -- exactly what a real host
      # would have at these paths, minus real values. deploy/env/build.env is what the documented
      # `docker compose --env-file deploy/env/build.env ... build` command actually reads (a bare
      # `docker compose build` does NOT load a same-named file automatically -- that was issue #1 in
      # this correction pass, and this job now exercises the corrected, documented command, not the
      # old implicit assumption). apps/web/lib/supabase/config.ts rejects an empty NEXT_PUBLIC_* string
      # at build time (found by this job's own earlier run), so these need to be syntactically valid,
      # not merely present. /etc/avenlyo/api.env needs enough to satisfy apps/api/src/env.ts's
      # NODE_ENV=production HTTPS guard; /etc/avenlyo/web.env can stay empty -- every NEXT_PUBLIC_*
      # value web's runtime touches is already inlined into the built server bundle at this point,
      # not read from the environment again at container start.
      - name: Create placeholder env files
        run: |
          cat > deploy/env/build.env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL=https://staging.avenlyo.com
          NEXT_PUBLIC_AVENLYO_API_URL=https://api-staging.avenlyo.com
          EOF
          sudo mkdir -p /etc/avenlyo
          sudo touch /etc/avenlyo/web.env
          cat <<'EOF' | sudo tee /etc/avenlyo/api.env > /dev/null
          API_HOST=0.0.0.0
          API_PORT=4000
          NODE_ENV=production
          WEB_CHAT_IFRAME_ORIGIN=https://staging.avenlyo.com
          EOF
          # 0640 root-owned (what docs/deployment/hetzner-staging.md specifies for the real host) is
          # unreadable by the unprivileged runner user `docker compose` actually runs as here, and
          # `docker compose` failed with exactly that permission error on the first run of this job.
          # A real host deploys as root or the dedicated `avenlyo` user/group, which the 0640 runbook
          # guidance is written for; this runner is neither, and these files carry only placeholder
          # strings, so relaxing to world-readable is a CI-only accommodation, not a change to the
          # documented production permission.
          sudo chmod 0644 /etc/avenlyo/*.env

      - name: Validate compose config
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config

      # Proves the seccomp profile path in deploy/compose.yaml's security_opt actually resolves from
      # Compose's own working directory (deploy/), not just that the file exists on disk somewhere.
      - name: Confirm the seccomp profile resolves in the rendered config
        run: |
          resolved="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config | grep 'seccomp' || true)"
          echo "Resolved seccomp entry: $resolved"
          if [ -z "$resolved" ]; then
            echo "::error::api service's seccomp profile did not appear in the resolved config."
            exit 1
          fi

      - name: Confirm bounded log rotation is present in the rendered config
        run: |
          docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config | grep -A3 'logging:' | tee /tmp/logging-config.txt
          test -s /tmp/logging-config.txt

      # Confirms none of the three services publish a host port other than Caddy's 80/443/443-udp --
      # web and api must show only `expose:`, never `ports:`.
      - name: Confirm 3000/4000 are not published to the host
        run: |
          rendered="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config)"
          if echo "$rendered" | grep -E '^\s+published:\s*"?(3000|4000)"?'; then
            echo "::error::web or api publishes a host port; only Caddy may."
            exit 1
          fi
          echo "Confirmed: no published host port for web or api."

      # BUILD ONCE, under the real SHA tag, through the documented --env-file mechanism -- the same
      # command docs/deployment/hetzner-staging.md's "Deploy procedure" now specifies. Builds both
      # images; nothing downstream re-builds.
      - name: docker compose build (BUILD ONCE, under the SHA tag)
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml build web api

      - name: Confirm SHA-tagged images were produced
        run: |
          docker image inspect "avenlyo-web:${AVENLYO_RELEASE}" > /dev/null
          docker image inspect "avenlyo-api:${AVENLYO_RELEASE}" > /dev/null
          echo "Confirmed avenlyo-web:${AVENLYO_RELEASE} and avenlyo-api:${AVENLYO_RELEASE} exist."

      # DEPLOY that exact already-built image -- --no-build is deliberate and load-bearing here: if
      # the previous step had failed to produce the tag, this fails loudly instead of silently
      # rebuilding something else. Caddy is deliberately not started: its Caddyfile names real public
      # hostnames, and bringing it up would attempt a real ACME/Let's Encrypt request against them
      # from a GitHub-owned IP that DNS does not point at -- out of scope for this job, which is
      # about the api/web service definitions, not Caddy's TLS behavior.
      - name: docker compose up --no-build (DEPLOY the already-built image)
        # --wait blocks until both services report healthy per their own Dockerfile HEALTHCHECK,
        # exercising that definition too, rather than a fixed sleep or a manual retry loop.
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml up -d --no-build --wait web api

      - name: Assert the running api service's user is not root
        run: |
          uid="$(docker compose -f deploy/compose.yaml exec -T api node -e 'process.stdout.write(String(process.getuid()))')"
          echo "api service UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::api service runs as UID 0 (root)."
            exit 1
          fi

      # This is Part D's mandatory proof, now run through the real service rather than a re-typed
      # `docker run`: `docker compose exec` runs inside the container `docker compose up` already
      # started, inheriting deploy/compose.yaml's own init/security_opt/seccomp/shm_size/user exactly
      # as configured -- proving the shipped compose file, not a manual reconstruction of it.
      #
      # Three real failures were found and fixed in earlier runs of this job, each now reflected in
      # deploy/compose.yaml's api service directly (see its comments for the full sequence): Docker's
      # default seccomp profile blocking unprivileged user-namespace creation (fixed by
      # deploy/chromium-seccomp.json, Playwright's own documented profile); the container's
      # entrypoint being PID 1, which broke a self-referential /proc/self chroot step inside
      # Chromium's own namespace-sandbox setup (fixed by `init: true`, Playwright's own documented
      # recommendation); and `cap_drop: ALL` being incompatible with that same setup, fixed by
      # matching Docker's default capability set -- exactly what Playwright's own official documented
      # command runs, nothing added beyond it, no SYS_ADMIN.
      - name: Real sandboxed Chromium launch inside the running api service
        run: docker compose -f deploy/compose.yaml exec -T api node dist/scripts/chromium-sandbox-smoke.js

      - name: api service answers /health/live
        run: |
          docker compose -f deploy/compose.yaml exec -T api node -e "fetch('http://127.0.0.1:4000/health/live').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"

      - name: web service answers /api/health
        run: |
          docker compose -f deploy/compose.yaml exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"

      # The API's trusted-proxy boundary is only as narrow as the set of containers that can open a
      # socket to it. deploy/compose.yaml puts web and api on separate bridge networks so that set is
      # exactly {caddy}; these two steps prove that separation on a real Docker daemon rather than by
      # reading the YAML back. Before the split, both services shared one network and web could
      # present a forwarding chain the API would have trusted.
      - name: web cannot reach the API directly
        run: |
          # A short timeout, because the expected outcome is a DNS failure or a refused connection --
          # not a slow response. Success here would mean the network separation is not real.
          if docker compose -f deploy/compose.yaml exec -T web node -e "
            const t = setTimeout(() => { console.error('timed out'); process.exit(1); }, 5000);
            fetch('http://api:4000/health/live')
              .then(r => { clearTimeout(t); console.error('REACHED api:4000, status ' + r.status); process.exit(0); })
              .catch(e => { clearTimeout(t); console.log('unreachable as expected: ' + e.constructor.name); process.exit(1); })
          "; then
            echo "::error::web reached api:4000 directly -- the api_edge/web_edge separation is not in effect."
            exit 1
          fi
          echo "Confirmed: web cannot address api:4000."

      - name: a peer on the API network can reach the API
        run: |
          # Caddy's position, without starting Caddy itself (its Caddyfile names real hostnames and
          # would attempt ACME from a runner IP DNS does not point at). A throwaway container joined
          # to the same api_edge network proves the network permits exactly what Caddy needs.
          network="$(docker network ls --format '{{.Name}}' | grep -E '_api_edge$' | head -1)"
          test -n "$network" || { echo "::error::api_edge network not found"; exit 1; }
          echo "Using network: $network"
          docker run --rm --network "$network" curlimages/curl:8.10.1 \
            -sS --fail --max-time 10 http://api:4000/health/live > /dev/null
          echo "Confirmed: a peer on $network reaches api:4000."

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  deployment-contract:
    name: Deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Phase 20 proves that BOTH deployment targets render safely, using placeholder configuration
    # only. No production DNS is resolved, no ACME request is made, no hosted database, Stripe,
    # Twilio, OpenAI, Google or ezyVet endpoint is contacted, and no real secret exists in this job.
    #
    # It deliberately does not rebuild the images. The heavy container proof already runs once in
    # "Hetzner staging container validation", and the two targets share one topology -- only public
    # hostname data differs. Building the same Dockerfiles twice would double the slowest job in CI
    # to re-prove something the render already shows, so this asserts the rendered configuration and
    # leaves the real container proof where it is.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fixtures, never the real deploy/env/build.env: that file is untracked, exists only on a
      # deployment host, and a CI job that read one would be a CI job that needs a secret.
      - name: Create placeholder deployment profiles
        run: |
          mkdir -p /tmp/profiles
          cat > /tmp/profiles/staging.env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL=https://staging.avenlyo.com
          NEXT_PUBLIC_AVENLYO_API_URL=https://api-staging.avenlyo.com
          AVENLYO_WEB_HOST=staging.avenlyo.com
          AVENLYO_API_HOST=api-staging.avenlyo.com
          AVENLYO_RELEASE=${{ github.sha }}
          EOF
          cat > /tmp/profiles/production.env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL=https://avenlyo.com
          NEXT_PUBLIC_AVENLYO_API_URL=https://api.avenlyo.com
          AVENLYO_WEB_HOST=avenlyo.com
          AVENLYO_API_HOST=api.avenlyo.com
          AVENLYO_RELEASE=${{ github.sha }}
          EOF
          sudo mkdir -p /etc/avenlyo
          sudo touch /etc/avenlyo/web.env /etc/avenlyo/api.env
          sudo chmod 0644 /etc/avenlyo/*.env

      - name: Render and assert the staging profile
        run: node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env

      - name: Render and assert the production profile
        run: node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/production.env

      # Negative proof. The guard must catch an injected cross-wire rather than merely existing:
      # a production profile carrying a staging hostname has to fail this job.
      - name: Injected staging hostname must fail the production profile
        run: |
          sed 's#https://api.avenlyo.com#https://api-staging.avenlyo.com#' \
            /tmp/profiles/production.env > /tmp/profiles/crosswired.env
          if node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/crosswired.env; then
            echo "::error::A production profile containing a staging hostname was accepted."
            exit 1
          fi
          echo "Confirmed: the cross-wired production profile is rejected."

      # Second negative proof, for the structural half. Phase 19's one-hop trust boundary is a
      # property of the topology, not of any hostname, so put web back onto api_edge -- where it can
      # reach the API directly and the trusted-proxy assumption stops holding -- and the assertion
      # has to reject it. Edits the checkout, which is disposable, and restores it afterwards.
      - name: Injected web/api network merge must fail the deployment contract
        run: |
          sed -i '77,78s/      - web_edge/      - web_edge\n      - api_edge/' deploy/compose.yaml
          if git diff --quiet deploy/compose.yaml; then
            echo "::error::The injection did not apply, so this negative test proves nothing."
            exit 1
          fi
          if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env; then
            echo "::error::A topology placing web and api on one network was accepted."
            git checkout -- deploy/compose.yaml
            exit 1
          fi
          git checkout -- deploy/compose.yaml
          echo "Confirmed: merging the web and api networks is rejected."

      - name: Preflight ships in the production artifact and runs under plain node
        run: |
          pnpm --filter @avenlyo/api build
          pnpm --filter @avenlyo/api smoke:ops-preflight
