name: CI

on:
  pull_request:
    branches: [main, feat/dynamic-website-knowledge]
  push:
    branches: [main, feat/dynamic-website-knowledge]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  rendered-browser-security:
    name: Rendered browser security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The rendered import runs hostile third-party JavaScript, so its confinement has to be proven
    # by a real browser rather than skipped. This job installs Chromium and fails if it is absent:
    # a silent skip here would mean the WebRTC, private-address, navigation, and resource-bound
    # regressions never ran. It is separate so the ordinary application job stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright-core never downloads a browser, so the binary is provided explicitly here and
      # nowhere else. Ordinary installs and the application job stay free of a Chromium download.
      - name: Install Chromium
        run: pnpm --filter @avenlyo/api exec playwright-core install --with-deps chromium

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and unprivileged user
      # namespaces are exactly what Chromium's sandbox needs to build its own as a non-root user.
      # Without this the sandboxed launch fails on the runner -- and the tempting fix, dropping the
      # sandbox, is the defect this job now exists to catch. So the host capability is enabled and
      # CI runs the same launch configuration production does, sandbox included.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: |
          # Tolerant of the key being absent: which of the two knobs exists is a kernel and
          # distribution detail, and an image that already permits this needs neither. Whether the
          # sandbox actually works is then decided by the suite launching a browser, not by these.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"

      - name: Require a usable Chromium
        run: pnpm --filter @avenlyo/api exec node --input-type=module -e "import { chromium } from 'playwright-core'; import { existsSync } from 'node:fs'; const path = chromium.executablePath(); if (!existsSync(path)) { console.error('Chromium is required for the rendered browser security suite.'); process.exit(1); } console.log('Chromium present.');"

      # Every case here launches through the production launch options, sandbox included, against
      # loopback fixtures: no public website, no DNS, and certificate errors are never ignored. A
      # host that cannot start a sandboxed Chromium fails this job rather than falling back, because
      # falling back is what put unsandboxed hostile JavaScript in the worker process.
      - name: Rendered browser security suite
        run: pnpm vitest run --config vitest.chromium.config.ts --reporter=verbose

      # A skipped security test is a security test that did not run. The suite is required to
      # execute every case, so the guard fails the job if any were skipped.
      - name: Fail if any rendered security test was skipped
        run: pnpm vitest run --config vitest.chromium.config.ts --reporter=json --outputFile=rendered-report.json && node -e "const r=require('./rendered-report.json'); const notRun=r.testResults.flatMap(f=>f.assertionResults).filter(a=>a.status!=='passed'); if(notRun.length||!r.numTotalTests){console.error('Rendered security tests did not all run:', notRun.map(a=>a.title)); process.exit(1);} console.log('All', r.numTotalTests, 'rendered tests executed.');"

  database-security:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned rather than floating. "latest" silently moved from v2.115.0 to v2.116.0 between
      # two runs of an unchanged schema, and v2.116.0 restored the hosted platform's
      # auto_expose_new_tables default -- which this suite promptly caught as fourteen real
      # privilege failures. A security gate whose toolchain can change underneath it reports
      # findings on a schedule nobody chose, so the version moves when someone reviews it.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: pnpm db:reset

      - name: Run pgTAP security tests
        run: pnpm db:test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  api-production-artifact:
    name: API production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Proves apps/api's real production build -- not `tsx src/server.ts` -- boots under plain Node
    # and shuts down cleanly. No Docker needed for this job; it is the pnpm/Node-only half of the
    # infra validation, kept separate from the Docker-dependent job below so it stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the API production bundle
        run: pnpm --filter @avenlyo/api build

      # ops-status is listed because it was missing: the runbook and package.json both told
      # operators to run it, and the production image -- which copies dist/ and ships no tsx -- had
      # no artifact for it. Asserting the file exists is the cheap half; the smoke below runs it.
      - name: Confirm the bundle exists
        run: |
          test -f apps/api/dist/server.js
          test -f apps/api/dist/scripts/chromium-sandbox-smoke.js
          test -f apps/api/dist/scripts/ops-status.js
          test -f apps/api/dist/scripts/ops-preflight.js
          # Every operator command the runbook names must be IN the artifact. smoke-production was
          # not: its package script ran the TypeScript source through tsx, which the production image
          # does not ship -- so the documented post-deploy check could not run where it was
          # documented to run. This list is the guard against that recurring.
          test -f apps/api/dist/scripts/smoke-production.js

      - name: Artifact boot smoke -- plain Node, /health/live, graceful SIGTERM
        run: pnpm --filter @avenlyo/api smoke:artifact

      - name: Operator status artifact smoke -- plain Node, bounded output, no secrets
        run: pnpm --filter @avenlyo/api smoke:ops-status

      - name: Post-deploy smoke artifact smoke -- plain Node, release assertion, no secrets
        run: pnpm --filter @avenlyo/api smoke:smoke-production

  hetzner-staging-containers:
    name: Hetzner staging container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Docker-dependent half. Everything here goes through deploy/compose.yaml itself -- the same
    # --env-file, the same `docker compose build` / `up` / `exec` a real deploy uses -- rather than
    # hand-copying its security_opt/init/shm_size arguments into separate `docker run` commands.
    # A prior version of this job did copy them, and that only proved the image plus a manually
    # re-typed set of flags; it did not prove deploy/compose.yaml's api service definition itself,
    # including whether `security_opt: [seccomp:./chromium-seccomp.json]` even resolves correctly
    # from Compose's own working directory. This version execs the sandbox smoke inside the actual
    # `docker compose up` service instead, so it does.
    env:
      # The exact CANDIDATE commit SHA under test -- matches how a real deploy tags images (see
      # docs/deployment/hetzner-staging.md's "Release identifier"), and is what "SHA-tagged images
      # are produced" below actually checks for.
      #
      # Not `github.sha`. On a pull_request event that is GitHub's SYNTHETIC merge commit
      # (refs/pull/N/merge), which exists only inside the run and names no commit on the branch. The
      # release contract is that a tag names the candidate commit, so tagging images with a merge SHA
      # nobody can check out makes the tag meaningless. `github.event.pull_request.head.sha` is the
      # reviewed head; the fallback covers push events, where `github.sha` is already correct.
      #
      # actions/checkout still checks out the merge result, deliberately -- testing the merge is the
      # useful thing. Only the release IDENTITY is corrected here, and the step below reports whether
      # the merge tree and the head tree actually agree rather than assuming they do.
      AVENLYO_RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Runs before anything is built or tagged: every image tag in this job is AVENLYO_RELEASE, so
      # if the identity is wrong, everything downstream is labelled wrong.
      - name: Release identity is the candidate commit, not a synthetic merge SHA
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          echo "event            : ${EVENT_NAME}"
          echo "AVENLYO_RELEASE  : ${AVENLYO_RELEASE}"
          echo "github.sha       : ${WORKFLOW_SHA}"
          echo "pr head sha      : ${PR_HEAD_SHA:-<not a pull_request>}"

          # 1. Shape. The deployment contract requires a full 40-character lowercase SHA; anything
          #    else would make the SHA-tagged image model meaningless.
          if ! printf '%s' "${AVENLYO_RELEASE}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::AVENLYO_RELEASE is not a 40-character lowercase hex SHA."
            exit 1
          fi

          # 2. On a pull_request it must be the reviewed head, never the synthetic merge commit.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ "${AVENLYO_RELEASE}" != "${PR_HEAD_SHA}" ]; then
              echo "::error::AVENLYO_RELEASE is not the pull request head SHA."
              exit 1
            fi
            if [ "${AVENLYO_RELEASE}" = "${WORKFLOW_SHA}" ]; then
              echo "::notice::github.sha equals the head SHA for this event; no merge commit was created."
            else
              echo "Confirmed: release identity is the PR head, not github.sha (${WORKFLOW_SHA})."
            fi
          fi

          # 3. Tree compatibility, REPORTED rather than assumed. actions/checkout deliberately checks
          #    out the merge result, which is the useful thing to test. When the branch is up to date
          #    with its base the merge tree is byte-identical to the head tree, and the images this
          #    job builds are exactly the candidate commit's bytes. When the base has moved ahead they
          #    legitimately differ: the images are then the merge preview, tagged with the candidate
          #    SHA. That is not a deployment integrity risk here -- these images are ephemeral, never
          #    pushed to a registry and torn down with the job -- but it is worth saying out loud
          #    rather than leaving to be assumed, so it is printed either way.
          git fetch --no-tags --depth=1 origin "${AVENLYO_RELEASE}" 2>/dev/null || true
          checked_out_tree=$(git rev-parse 'HEAD^{tree}')
          if candidate_tree=$(git rev-parse "${AVENLYO_RELEASE}^{tree}" 2>/dev/null); then
            echo "checked-out tree : ${checked_out_tree}"
            echo "candidate tree   : ${candidate_tree}"
            if [ "${checked_out_tree}" = "${candidate_tree}" ]; then
              echo "Tree comparison  : IDENTICAL -- the built images are the candidate commit's bytes."
            else
              echo "::notice::Merge tree differs from the candidate head tree; the base has moved ahead."
              echo "Tree comparison  : DIFFERENT -- images are the merge preview, tagged with the head SHA."
            fi
          else
            echo "::notice::Candidate commit object unavailable; tree comparison skipped."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same finding as the existing "Rendered browser security" job: Ubuntu 24.04 runners restrict
      # unprivileged user namespaces through AppArmor, which is exactly what Chromium's sandbox needs
      # to build its own as a non-root user. This is a host (runner) kernel setting, independent of
      # Docker's own seccomp profile, and containers share the host kernel -- so it has to be set
      # here too, once, before any container that launches Chromium runs.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"

      # Three placeholder files, none committed, none real configuration -- exactly what a real host
      # would have at these paths, minus real values. deploy/env/build.env is what the documented
      # `docker compose --env-file deploy/env/build.env ... build` command actually reads (a bare
      # `docker compose build` does NOT load a same-named file automatically -- that was issue #1 in
      # this correction pass, and this job now exercises the corrected, documented command, not the
      # old implicit assumption). apps/web/lib/supabase/config.ts rejects an empty NEXT_PUBLIC_* string
      # at build time (found by this job's own earlier run), so these need to be syntactically valid,
      # not merely present. /etc/avenlyo/api.env needs enough to satisfy apps/api/src/env.ts's
      # NODE_ENV=production HTTPS guard; /etc/avenlyo/web.env can stay empty -- every NEXT_PUBLIC_*
      # value web's runtime touches is already inlined into the built server bundle at this point,
      # not read from the environment again at container start. It also needs
      # AVENLYO_DEPLOYMENT_ENV: NODE_ENV=production no longer identifies a deployment on its own,
      # and this fixture is staging-shaped, so it declares staging exactly as the real host does.
      - name: Create placeholder env files
        run: |
          # Assembled exactly the way deploy/env/build.env.example documents: the source-controlled
          # public profile, plus the two browser-facing Supabase values that cannot be committed.
          # Not typed out here -- a fixture this job maintained separately is a fixture that can
          # prove a profile no operator has.
          {
            cat deploy/env/staging.public.env.example
            echo "NEXT_PUBLIC_SUPABASE_URL=https://ciplaceholderproject.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key"
            echo "AVENLYO_RELEASE=${AVENLYO_RELEASE}"
          } > deploy/env/build.env
          sudo mkdir -p /etc/avenlyo
          sudo touch /etc/avenlyo/web.env
          # The server-only half of the same deployment. API_CORS_ORIGIN and WEB_CHAT_IFRAME_ORIGIN
          # live here, with the secrets, and must name the profile's public web origin -- which is
          # what the one-off preflight below actually checks across the two files.
          cat <<'EOF' | sudo tee /etc/avenlyo/api.env > /dev/null
          API_HOST=0.0.0.0
          API_PORT=4000
          API_CORS_ORIGIN=https://staging.avenlyo.com
          AVENLYO_DEPLOYMENT_ENV=staging
          NODE_ENV=production
          WEB_CHAT_IFRAME_ORIGIN=https://staging.avenlyo.com
          EOF
          # 0640 root-owned (what docs/deployment/hetzner-staging.md specifies for the real host) is
          # unreadable by the unprivileged runner user `docker compose` actually runs as here, and
          # `docker compose` failed with exactly that permission error on the first run of this job.
          # A real host deploys as root or the dedicated `avenlyo` user/group, which the 0640 runbook
          # guidance is written for; this runner is neither, and these files carry only placeholder
          # strings, so relaxing to world-readable is a CI-only accommodation, not a change to the
          # documented production permission.
          sudo chmod 0644 /etc/avenlyo/*.env

      - name: Validate compose config
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config

      # Proves the seccomp profile path in deploy/compose.yaml's security_opt actually resolves from
      # Compose's own working directory (deploy/), not just that the file exists on disk somewhere.
      - name: Confirm the seccomp profile resolves in the rendered config
        run: |
          resolved="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config | grep 'seccomp' || true)"
          echo "Resolved seccomp entry: $resolved"
          if [ -z "$resolved" ]; then
            echo "::error::api service's seccomp profile did not appear in the resolved config."
            exit 1
          fi

      - name: Confirm bounded log rotation is present in the rendered config
        run: |
          docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config | grep -A3 'logging:' | tee /tmp/logging-config.txt
          test -s /tmp/logging-config.txt

      # Confirms none of the three services publish a host port other than Caddy's 80/443/443-udp --
      # web and api must show only `expose:`, never `ports:`.
      - name: Confirm 3000/4000 are not published to the host
        run: |
          rendered="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml config)"
          if echo "$rendered" | grep -E '^\s+published:\s*"?(3000|4000)"?'; then
            echo "::error::web or api publishes a host port; only Caddy may."
            exit 1
          fi
          echo "Confirmed: no published host port for web or api."

      # BUILD ONCE, under the real SHA tag, through the documented --env-file mechanism -- the same
      # command docs/deployment/hetzner-staging.md's "Deploy procedure" now specifies. Builds both
      # images; nothing downstream re-builds.
      - name: docker compose build (BUILD ONCE, under the SHA tag)
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml build web api

      - name: Confirm SHA-tagged images were produced
        run: |
          docker image inspect "avenlyo-web:${AVENLYO_RELEASE}" > /dev/null
          docker image inspect "avenlyo-api:${AVENLYO_RELEASE}" > /dev/null
          echo "Confirmed avenlyo-web:${AVENLYO_RELEASE} and avenlyo-api:${AVENLYO_RELEASE} exist."

      # THE OPERATOR PREFLIGHT PATH, exercised exactly as docs/production-runbook.md documents it.
      #
      # The runbook used to say `pnpm ops:preflight` on the host, which was not a real execution
      # path: a host shell receives neither /etc/avenlyo/api.env nor the AVENLYO_PROFILE_* values
      # Compose injects, and a deployment host is not guaranteed to hold a built dist/ at all. So
      # preflight would either fail to start or validate a profile the deployment does not use --
      # in both cases the gate that "must exit 0 before anything is applied" was fiction.
      #
      # The real path is a one-off container from the SAME compose file, the SAME --env-file and the
      # SAME /etc/avenlyo/api.env the deployment runs with. `--no-deps` keeps web and caddy down;
      # `--rm` leaves nothing behind; the command is read-only.
      #
      # `docker compose run` has no --no-build flag (checked against Compose v2's own --help), and
      # it builds an image that is missing. The image-inspect above is therefore the guard: the tag
      # provably exists before this runs, so nothing here can build. The digest comparison below
      # proves that rather than assuming it.
      - name: ops-preflight as a one-off container from the prebuilt SHA image
        run: |
          before="$(docker image inspect -f '{{.Id}}' "avenlyo-api:${AVENLYO_RELEASE}")"
          set +e
          output="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml \
            run --rm --no-deps -T api node dist/scripts/ops-preflight.js --json 2>&1)"
          status=$?
          set -e
          echo "$output"
          after="$(docker image inspect -f '{{.Id}}' "avenlyo-api:${AVENLYO_RELEASE}")"
          if [ "$before" != "$after" ]; then
            echo "::error::The preflight run rebuilt avenlyo-api; it must use the prebuilt image."
            exit 1
          fi
          # Exit 1, not 2: this placeholder deployment has no database, so the schema probe cannot
          # answer and the fail-closed rule fails that one check. 2 would mean the configuration was
          # uninterpretable, which is a different defect.
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected exit 1 from the placeholder preflight, got ${status}."
            exit 1
          fi
          # And schema_compatible must be the ONLY failure. That is the positive half of this proof:
          # every profile agreement -- identity match across the two files, CORS vs app origin, the
          # Caddy host agreement, the internal boundary, published ports -- passed through the real
          # container path, against the real profile, rather than in a unit test's fixture.
          failed="$(echo "$output" | node -e "
            let s=''; process.stdin.on('data', c => s += c).on('end', () => {
              const start = s.indexOf('{');
              process.stdout.write(JSON.parse(s.slice(start)).failed.join(','));
            });
          ")"
          echo "Failed checks: ${failed}"
          if [ "$failed" != "schema_compatible" ]; then
            echo "::error::Expected only schema_compatible to fail, got: ${failed}"
            exit 1
          fi
          echo "Confirmed: the documented operator preflight command runs the prebuilt SHA image,"
          echo "sees the full deployment profile, and fails closed only on the unprovable schema."

      # Negative proof for the two-file identity agreement. The profile says staging; make the
      # container's own runtime identity say production and the same command must reject it -- the
      # cross-wire neither file can detect alone.
      - name: Profile and runtime deployment identity must agree
        run: |
          set +e
          output="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml \
            run --rm --no-deps -T -e AVENLYO_DEPLOYMENT_ENV=production api \
            node dist/scripts/ops-preflight.js --json 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::A container whose identity disagrees with its profile was accepted."
            exit 1
          fi
          if ! echo "$output" | grep -q 'deployment_identity_agreement'; then
            echo "::error::Expected a deployment_identity_agreement failure."
            exit 1
          fi
          echo "Confirmed: a profile/runtime identity disagreement fails the preflight."

      # DEPLOY that exact already-built image -- --no-build is deliberate and load-bearing here: if
      # the previous step had failed to produce the tag, this fails loudly instead of silently
      # rebuilding something else. Caddy is deliberately not started: its Caddyfile names real public
      # hostnames, and bringing it up would attempt a real ACME/Let's Encrypt request against them
      # from a GitHub-owned IP that DNS does not point at -- out of scope for this job, which is
      # about the api/web service definitions, not Caddy's TLS behavior.
      - name: docker compose up --no-build (DEPLOY the already-built image)
        # --wait blocks until both services report healthy per their own Dockerfile HEALTHCHECK,
        # exercising that definition too, rather than a fixed sleep or a manual retry loop.
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml up -d --no-build --wait web api

      - name: Assert the running api service's user is not root
        run: |
          uid="$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml exec -T api node -e 'process.stdout.write(String(process.getuid()))')"
          echo "api service UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::api service runs as UID 0 (root)."
            exit 1
          fi

      # This is Part D's mandatory proof, now run through the real service rather than a re-typed
      # `docker run`: `docker compose exec` runs inside the container `docker compose up` already
      # started, inheriting deploy/compose.yaml's own init/security_opt/seccomp/shm_size/user exactly
      # as configured -- proving the shipped compose file, not a manual reconstruction of it.
      #
      # Three real failures were found and fixed in earlier runs of this job, each now reflected in
      # deploy/compose.yaml's api service directly (see its comments for the full sequence): Docker's
      # default seccomp profile blocking unprivileged user-namespace creation (fixed by
      # deploy/chromium-seccomp.json, Playwright's own documented profile); the container's
      # entrypoint being PID 1, which broke a self-referential /proc/self chroot step inside
      # Chromium's own namespace-sandbox setup (fixed by `init: true`, Playwright's own documented
      # recommendation); and `cap_drop: ALL` being incompatible with that same setup, fixed by
      # matching Docker's default capability set -- exactly what Playwright's own official documented
      # command runs, nothing added beyond it, no SYS_ADMIN.
      - name: Real sandboxed Chromium launch inside the running api service
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml exec -T api node dist/scripts/chromium-sandbox-smoke.js

      - name: api service answers /health/live
        run: |
          docker compose --env-file deploy/env/build.env -f deploy/compose.yaml exec -T api node -e "fetch('http://127.0.0.1:4000/health/live').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"

      - name: web service answers /api/health
        run: |
          docker compose --env-file deploy/env/build.env -f deploy/compose.yaml exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"

      # ---------------------------------------------------------------------------------------
      # The documented post-deploy operator commands, run the way the runbook says to run them.
      # ---------------------------------------------------------------------------------------
      # Neither needs Node or pnpm on the host, which is the point: the real Hetzner staging host has
      # neither, and a documented step an operator cannot run is not a procedure. Both scripts ship
      # inside the exact SHA-tagged image.

      # `exec`, not `run`: ops-status describes the deployment that is actually running, so it has to
      # execute inside it. Supabase is unconfigured in this job, so it exits 1 having reported that
      # honestly -- what is proven here is the invocation shape and that the command exists in the
      # image and runs under plain node, not a healthy platform.
      - name: ops-status runs inside the running api container (no host Node)
        run: |
          set +e
          out=$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml \
            exec -T api node dist/scripts/ops-status.js 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected exit 1 from an unconfigured ops-status, got ${status}."
            exit 1
          fi
          if echo "$out" | grep -qE '\n\s+at .+:[0-9]+:[0-9]+'; then
            echo "::error::ops-status printed a stack trace."
            exit 1
          fi
          echo "Confirmed: dist/scripts/ops-status.js runs in the deployed container under plain node."

      # `run`, not `exec`: the one-off container is created from the image the profile INTENDED, so
      # its AVENLYO_RELEASE is the expectation while the probes hit whatever is actually serving. If
      # `up` had silently kept a previous image, api_release would fail. Under `exec` both values
      # would come from the same process and the check could never fail.
      #
      # TWO checks are expected to FAIL here, and both are properties of this CI fixture rather than
      # of the smoke. Asserting the exact expected set -- rather than only that some checks passed --
      # is what keeps this honest: an unexpected failure is a real regression, and an unexpected pass
      # would mean the fixture stopped reproducing the conditions it claims to.
      #
      #   api_ready  FAIL http_503
      #     This placeholder deployment has NO DATABASE. /health/ready reports 503 precisely because
      #     it is doing its job. The ops-preflight step earlier in this same job asserts the mirror
      #     image of this fact -- that schema_compatible is its ONE failure, for the same missing
      #     database. Expecting api_ready to pass here contradicted that, and it is what made this
      #     job fail deterministically.
      #
      #   web_live   FAIL http_404
      #     Caddy is deliberately not started in this job: its Caddyfile names real public hostnames
      #     and bringing it up would attempt a real ACME request from a GitHub-owned IP that DNS does
      #     not point at. So the public hostnames are unreachable and the probe target is overridden
      #     to the internal API address, which does not serve /api/health.
      #
      # In a real staging or production deployment api_ready is REQUIRED, and smoke-production is not
      # relaxed in any way to accommodate this fixture.
      - name: smoke-production runs from the exact release image (no host Node)
        run: |
          set +e
          out=$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml \
            run --rm --no-deps -T \
            -e AVENLYO_API_BASE_URL=http://api:4000 \
            -e AVENLYO_PROFILE_APP_URL=http://api:4000 \
            api node dist/scripts/smoke-production.js 2>&1)
          status=$?
          set -e
          echo "$out"

          if [ "$status" -eq 0 ]; then
            echo "::error::Expected a non-zero exit for this fixture's two known limitations."
            exit 1
          fi

          # What must pass: the artifact ran from the built image, reached the deployment over the
          # network, and confirmed the deployed release is the one the profile intended.
          for expected in "pass  api_live" "pass  api_release"; do
            if ! echo "$out" | grep -q "$expected"; then
              echo "::error::Expected '${expected}' in the smoke report."
              exit 1
            fi
          done

          # What must fail, for exactly the documented fixture reasons -- including the HTTP detail,
          # so a different cause cannot quietly satisfy the same assertion.
          for expected in "FAIL  api_ready  http_503" "FAIL  web_live  http_404"; do
            if ! echo "$out" | grep -q "$expected"; then
              echo "::error::Expected '${expected}' -- this fixture has no database and no Caddy."
              exit 1
            fi
          done

          # And nothing else may fail. Two known limitations, no more.
          failed=$(echo "$out" | grep -c '^FAIL  ' || true)
          if [ "$failed" -ne 2 ]; then
            echo "::error::Expected exactly 2 failing checks (api_ready, web_live), saw ${failed}."
            exit 1
          fi
          echo "Confirmed: the post-deploy smoke runs from the release image, probes over the network,"
          echo "asserts the deployed release, and fails only on this fixture's missing DB and Caddy."

      # And the release assertion must be able to fail, or it is decoration.
      #
      # Identical to the step above except for the expected release, so the difference in outcome is
      # attributable to that one variable: the same two fixture limitations fail, and api_release
      # becomes a THIRD failure. This is the case that catches `up` having silently kept a previous
      # image -- the failure nobody notices because everything else is green.
      - name: smoke-production rejects a deployment serving a different release
        run: |
          set +e
          out=$(docker compose --env-file deploy/env/build.env -f deploy/compose.yaml \
            run --rm --no-deps -T \
            -e AVENLYO_API_BASE_URL=http://api:4000 \
            -e AVENLYO_PROFILE_APP_URL=http://api:4000 \
            -e AVENLYO_EXPECTED_RELEASE=1111111111111111111111111111111111111111 \
            api node dist/scripts/smoke-production.js 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::The smoke accepted a deployment serving a different release."
            exit 1
          fi
          if ! echo "$out" | grep -q "FAIL  api_release  release_mismatch"; then
            echo "::error::Expected api_release to be reported FAIL with release_mismatch."
            exit 1
          fi
          if ! echo "$out" | grep -q "pass  api_live"; then
            echo "::error::api_live should still pass; only the release expectation changed."
            exit 1
          fi
          # Exactly one more failure than the baseline: the two fixture limitations plus this one.
          failed=$(echo "$out" | grep -c '^FAIL  ' || true)
          if [ "$failed" -ne 3 ]; then
            echo "::error::Expected exactly 3 failing checks (api_ready, web_live, api_release), saw ${failed}."
            exit 1
          fi
          echo "Confirmed: a wrong expected release adds api_release to the failures, and nothing else changes."

      # The API's trusted-proxy boundary is only as narrow as the set of containers that can open a
      # socket to it. deploy/compose.yaml puts web and api on separate bridge networks so that set is
      # exactly {caddy}; these two steps prove that separation on a real Docker daemon rather than by
      # reading the YAML back. Before the split, both services shared one network and web could
      # present a forwarding chain the API would have trusted.
      - name: web cannot reach the API directly
        run: |
          # A short timeout, because the expected outcome is a DNS failure or a refused connection --
          # not a slow response. Success here would mean the network separation is not real.
          if docker compose --env-file deploy/env/build.env -f deploy/compose.yaml exec -T web node -e "
            const t = setTimeout(() => { console.error('timed out'); process.exit(1); }, 5000);
            fetch('http://api:4000/health/live')
              .then(r => { clearTimeout(t); console.error('REACHED api:4000, status ' + r.status); process.exit(0); })
              .catch(e => { clearTimeout(t); console.log('unreachable as expected: ' + e.constructor.name); process.exit(1); })
          "; then
            echo "::error::web reached api:4000 directly -- the api_edge/web_edge separation is not in effect."
            exit 1
          fi
          echo "Confirmed: web cannot address api:4000."

      - name: a peer on the API network can reach the API
        run: |
          # Caddy's position, without starting Caddy itself (its Caddyfile names real hostnames and
          # would attempt ACME from a runner IP DNS does not point at). A throwaway container joined
          # to the same api_edge network proves the network permits exactly what Caddy needs.
          network="$(docker network ls --format '{{.Name}}' | grep -E '_api_edge$' | head -1)"
          test -n "$network" || { echo "::error::api_edge network not found"; exit 1; }
          echo "Using network: $network"
          docker run --rm --network "$network" curlimages/curl:8.10.1 \
            -sS --fail --max-time 10 http://api:4000/health/live > /dev/null
          echo "Confirmed: a peer on $network reaches api:4000."

      - name: Tear down
        if: always()
        run: docker compose --env-file deploy/env/build.env -f deploy/compose.yaml down -v

  deployment-contract:
    name: Deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Phase 20 proves that BOTH deployment targets render safely, using placeholder configuration
    # only. No production DNS is resolved, no ACME request is made, no hosted database, Stripe,
    # Twilio, OpenAI, Google or ezyVet endpoint is contacted, and no real secret exists in this job.
    #
    # It deliberately does not rebuild the images. The heavy container proof already runs once in
    # "Hetzner staging container validation", and the two targets share one topology -- only public
    # hostname data differs. Building the same Dockerfiles twice would double the slowest job in CI
    # to re-prove something the render already shows, so this asserts the rendered configuration and
    # leaves the real container proof where it is.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Profiles GENERATED FROM the source templates, never typed out here.
      #
      # This job used to carry its own hand-written profiles, and they had drifted: CI proved a
      # richer profile (AVENLYO_DEPLOYMENT_ENV, AVENLYO_API_URL) than deploy/env/build.env.example
      # -- the template an operator is told to copy -- actually contained. A green deployment
      # contract therefore said nothing about the file a human would deploy from.
      #
      # The templates are now the profile. All CI adds is what genuinely cannot be committed: the
      # two browser-facing Supabase values and the release SHA. Duplicate keys later in an env file
      # win, which is how the empty AVENLYO_RELEASE= in the template is filled here.
      #
      # The real deploy/env/build.env is never read: it is untracked, exists only on a deployment
      # host, and a CI job that read one would be a CI job that needs a secret.
      - name: Assemble deployment profiles from the source templates
        run: |
          mkdir -p /tmp/profiles
          for target in staging production; do
            {
              cat "deploy/env/${target}.public.env.example"
              echo "NEXT_PUBLIC_SUPABASE_URL=https://ciplaceholderproject.supabase.co"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key"
              # The candidate commit, not the synthetic pull_request merge SHA -- see the
              # AVENLYO_RELEASE comment on the container job. The assertion script requires an exact
              # 40-character SHA, so this profile has to carry a real one.
              echo "AVENLYO_RELEASE=${{ github.event.pull_request.head.sha || github.sha }}"
              echo "AVENLYO_EXPECTED_SUPABASE_PROJECT_REF=ciplaceholderproject"
            } > "/tmp/profiles/${target}.env"
          done
          # A REALISTIC server-only env file, not an empty one.
          #
          # This job used to `touch` an empty /etc/avenlyo/api.env, and that emptiness hid a real
          # defect for a whole release: `docker compose config` resolves `env_file:` into the
          # rendered service environment, so on a real host every assignment here appears in the
          # render. An assertion that asked the RENDER where a value came from therefore failed on a
          # correctly configured host -- and passed in CI, because there was nothing to merge.
          #
          # Phase 21A hit exactly that on the live staging host. The fixture now carries the
          # non-secret runtime values a real api.env carries, so the assertion is exercised against
          # the shape that actually broke. Placeholders only; no secret exists in this job.
          sudo mkdir -p /etc/avenlyo
          sudo touch /etc/avenlyo/web.env
          cat <<'EOF' | sudo tee /etc/avenlyo/api.env > /dev/null
          API_HOST=0.0.0.0
          API_PORT=4000
          AVENLYO_DEPLOYMENT_ENV=staging
          NODE_ENV=production
          API_CORS_ORIGIN=https://staging.avenlyo.com
          WEB_CHAT_IFRAME_ORIGIN=https://staging.avenlyo.com
          EOF
          sudo chmod 0644 /etc/avenlyo/*.env

      # Pins the blind spot closed. The fixture is only useful if it actually reproduces the merge,
      # so this proves the merge happens -- and therefore that the previous implementation, which
      # read the rendered environment to decide provenance, would have failed here.
      - name: Prove the fixture reproduces env_file merging (the old check would fail)
        run: |
          docker compose --env-file /tmp/profiles/staging.env -f deploy/compose.yaml config \
            > /tmp/rendered.yaml
          api_block=$(awk '/^  api:/,/^  caddy:/' /tmp/rendered.yaml)
          if ! echo "$api_block" | grep -qE '^      AVENLYO_DEPLOYMENT_ENV:'; then
            echo "::error::env_file did not merge into the render; this fixture no longer reproduces"
            echo "::error::the real host shape, so the regression it guards is not being tested."
            exit 1
          fi
          echo "Confirmed: /etc/avenlyo/api.env is merged into the rendered api environment."
          echo "The pre-fix assertion read that merged view and would have failed here."
          # Only key names are printed -- never the rendered document, which on a real host
          # contains every value from /etc/avenlyo/api.env.
          echo "Merged api environment keys:"
          echo "$api_block" | grep -oE '^      [A-Z0-9_]+:' | tr -d ' :' | sort | sed 's/^/  /'
          rm -f /tmp/rendered.yaml

      - name: Render and assert the staging profile
        run: node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env

      - name: Render and assert the production profile
        run: node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/production.env

      # Negative proof. The guard must catch an injected cross-wire rather than merely existing:
      # a production profile carrying a staging hostname has to fail this job.
      - name: Injected staging hostname must fail the production profile
        run: |
          sed 's#https://api.avenlyo.com#https://api-staging.avenlyo.com#' \
            /tmp/profiles/production.env > /tmp/profiles/crosswired.env
          if node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/crosswired.env; then
            echo "::error::A production profile containing a staging hostname was accepted."
            exit 1
          fi
          echo "Confirmed: the cross-wired production profile is rejected."

      # The deployment identity must come from the profile, not from this workflow's argument.
      # If the argument were the authority, a profile could claim to be staging -- or claim nothing
      # -- and still be validated under production rules because the caller said so.
      - name: Profile whose declared identity disagrees with the target must fail
        run: |
          sed 's#AVENLYO_DEPLOYMENT_ENV=production#AVENLYO_DEPLOYMENT_ENV=staging#' \
            /tmp/profiles/production.env > /tmp/profiles/mislabelled.env
          if node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/mislabelled.env; then
            echo "::error::A profile declaring staging was accepted as production."
            exit 1
          fi
          echo "Confirmed: a profile whose identity disagrees with the target is rejected."

      - name: Deployed profile with no declared identity must fail
        run: |
          grep -v '^AVENLYO_DEPLOYMENT_ENV=' /tmp/profiles/production.env > /tmp/profiles/anonymous.env
          if node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/anonymous.env; then
            echo "::error::A deployed profile with no declared deployment identity was accepted."
            exit 1
          fi
          echo "Confirmed: an undeclared deployment identity is rejected."

      # Every required profile key, one at a time. A key that can go missing without failing is a
      # key whose contract is not actually part of the deployment contract.
      - name: Each required profile key must be individually required
        run: |
          for key in AVENLYO_API_HOST AVENLYO_API_URL AVENLYO_WEB_HOST \
                     NEXT_PUBLIC_APP_URL NEXT_PUBLIC_AVENLYO_API_URL; do
            grep -v "^${key}=" /tmp/profiles/staging.env > /tmp/profiles/incomplete.env
            if ! diff -q /tmp/profiles/staging.env /tmp/profiles/incomplete.env > /dev/null; then
              :
            else
              echo "::error::${key} was not present to remove; this proof is a no-op."
              exit 1
            fi
            if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/incomplete.env; then
              echo "::error::A deployment profile missing ${key} was accepted."
              exit 1
            fi
            echo "Confirmed: a profile missing ${key} is rejected."
          done

      # The profile is the single authority for the web container's route to the API. Sever that
      # wiring in the compose file and the contract must notice: otherwise preflight would certify
      # http://caddy:8080 from the profile while the container ran something else.
      - name: Web AVENLYO_API_URL must come from the profile, not a literal
        run: |
          sed -i 's#^      AVENLYO_API_URL: ${AVENLYO_API_URL.*#      AVENLYO_API_URL: http://api:4000#' \
            deploy/compose.yaml
          if git diff --quiet deploy/compose.yaml; then
            echo "::error::The injection did not apply, so this negative test proves nothing."
            exit 1
          fi
          if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env; then
            echo "::error::A web service whose API URL ignores the deployment profile was accepted."
            git checkout -- deploy/compose.yaml
            exit 1
          fi
          git checkout -- deploy/compose.yaml
          echo "Confirmed: the web service's AVENLYO_API_URL must come from the profile."

      # The runtime identity lives in /etc/avenlyo/api.env; the profile's copy is mirrored under a
      # separate name. If the profile were allowed to supply the runtime name, Compose's
      # `environment:` precedence would let it overwrite the container's own identity silently.
      #
      # Asserted against the compose SOURCE, so it stays true regardless of what api.env merges into
      # the render -- and these injections now run with a realistic non-empty api.env, which is what
      # makes them meaningful rather than vacuous.
      - name: The profile must not override the api runtime deployment identity
        run: |
          sed -i 's#^      AVENLYO_PROFILE_DEPLOYMENT_ENV: #      AVENLYO_DEPLOYMENT_ENV: #' \
            deploy/compose.yaml
          if git diff --quiet deploy/compose.yaml; then
            echo "::error::The injection did not apply, so this negative test proves nothing."
            exit 1
          fi
          if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env; then
            echo "::error::A profile able to overwrite the api runtime deployment identity was accepted."
            git checkout -- deploy/compose.yaml
            exit 1
          fi
          git checkout -- deploy/compose.yaml
          echo "Confirmed: the profile cannot overwrite the api runtime deployment identity."

      # The EXPECTED Supabase project ref must reach the API from the deployment profile. It was
      # declared in the profile but never forwarded, so the value was inert and the documented
      # production path failed with an undeclared identity unless the operator duplicated the key
      # into api.env -- which is exactly where it must not live, because that file also holds the
      # SUPABASE_URL being checked.
      - name: The expected Supabase project ref must be mirrored from the profile
        run: |
          for injection in \
            '/^      AVENLYO_PROFILE_EXPECTED_SUPABASE_PROJECT_REF:/d' \
            's#^      AVENLYO_PROFILE_EXPECTED_SUPABASE_PROJECT_REF: .*#      AVENLYO_PROFILE_EXPECTED_SUPABASE_PROJECT_REF: hardcodedref#' \
            's#^      AVENLYO_PROFILE_EXPECTED_SUPABASE_PROJECT_REF: #      AVENLYO_EXPECTED_SUPABASE_PROJECT_REF: #'; do
            sed -i "$injection" deploy/compose.yaml
            if git diff --quiet deploy/compose.yaml; then
              echo "::error::Injection '$injection' did not apply; this proves nothing."
              exit 1
            fi
            if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env; then
              echo "::error::Accepted a compose file with injection: $injection"
              git checkout -- deploy/compose.yaml
              exit 1
            fi
            git checkout -- deploy/compose.yaml
            echo "Confirmed rejected: $injection"
          done

      # Positive half: the mirror actually carries the profile's value into the api service, and the
      # runtime name is never supplied by compose.
      - name: The mirrored expected ref reaches the api service
        run: |
          docker compose --env-file /tmp/profiles/production.env -f deploy/compose.yaml config \
            > /tmp/rendered.yaml
          api_block=$(awk '/^  api:/,/^  caddy:/' /tmp/rendered.yaml)
          if ! echo "$api_block" | grep -q '^      AVENLYO_PROFILE_EXPECTED_SUPABASE_PROJECT_REF: ciplaceholderproject'; then
            echo "::error::The profile's expected project ref did not reach the api service."
            exit 1
          fi
          if awk '/^  api:/,/^  caddy:/' deploy/compose.yaml | grep -qE '^      AVENLYO_EXPECTED_SUPABASE_PROJECT_REF:'; then
            echo "::error::compose supplies the runtime name; the expectation must be mirrored only."
            exit 1
          fi
          echo "Confirmed: EXPECTED comes from the profile, ACTUAL stays in api.env."
          rm -f /tmp/rendered.yaml

      - name: The profile identity mirror must exist and come from the profile
        run: |
          for injection in \
            '/^      AVENLYO_PROFILE_DEPLOYMENT_ENV:/d' \
            's#^      AVENLYO_PROFILE_DEPLOYMENT_ENV: .*#      AVENLYO_PROFILE_DEPLOYMENT_ENV: staging#'; do
            sed -i "$injection" deploy/compose.yaml
            if git diff --quiet deploy/compose.yaml; then
              echo "::error::Injection '$injection' did not apply; this proves nothing."
              exit 1
            fi
            if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env; then
              echo "::error::Accepted a compose file with injection: $injection"
              git checkout -- deploy/compose.yaml
              exit 1
            fi
            git checkout -- deploy/compose.yaml
            echo "Confirmed rejected: $injection"
          done

      # The production profile must actually override the Caddyfile's staging substitution defaults.
      # Checked on the rendered keys the profile feeds -- not by scanning the whole document, which
      # would also be reading api.env's merged values.
      - name: A hardcoded Caddy hostname must fail the production profile
        run: |
          sed -i 's#^      AVENLYO_WEB_HOST: ${AVENLYO_WEB_HOST.*#      AVENLYO_WEB_HOST: staging.avenlyo.com#' \
            deploy/compose.yaml
          if git diff --quiet deploy/compose.yaml; then
            echo "::error::The injection did not apply, so this negative test proves nothing."
            exit 1
          fi
          if node .github/scripts/assert-deployment-profile.mjs production /tmp/profiles/production.env; then
            echo "::error::A production profile whose Caddy hostname ignores it was accepted."
            git checkout -- deploy/compose.yaml
            exit 1
          fi
          git checkout -- deploy/compose.yaml
          echo "Confirmed: Caddy's public hostnames must come from the deployment profile."

      # The command docs/production-runbook.md tells an operator to run on the deployment host,
      # exercised exactly as documented. It is the host-side gate precisely because it needs only
      # Docker and Compose -- the staging host has no Node runtime, so the assertion script above is
      # a CI/local source gate and never a host step.
      #
      # `--quiet` is load-bearing: plain `config` prints every value merged from
      # /etc/avenlyo/api.env, which on a real host means the service-role key and every provider
      # secret. The documented operator path must never put that on a terminal or in a ticket.
      - name: Documented host-side validation command (no Node runtime required)
        run: |
          for target in staging production; do
            docker compose --env-file "/tmp/profiles/${target}.env" -f deploy/compose.yaml config --quiet
            echo "config --quiet exit=$? for ${target}"
          done
          out=$(docker compose --env-file /tmp/profiles/staging.env -f deploy/compose.yaml config --quiet 2>&1)
          if [ -n "$out" ]; then
            echo "::error::config --quiet printed output; the documented operator path must stay silent."
            exit 1
          fi
          echo "Confirmed: the documented host validation is silent and therefore secret-safe."

      - name: The documented host command must reject a broken profile
        run: |
          grep -v '^AVENLYO_API_URL=' /tmp/profiles/staging.env > /tmp/profiles/nourl.env
          if docker compose --env-file /tmp/profiles/nourl.env -f deploy/compose.yaml config --quiet 2>/dev/null; then
            echo "::error::config --quiet accepted a profile missing a required substitution."
            exit 1
          fi
          echo "Confirmed: the required-substitution contract fails closed on the host path too."

      # Second negative proof, for the structural half. Phase 19's one-hop trust boundary is a
      # property of the topology, not of any hostname, so put web back onto api_edge -- where it can
      # reach the API directly and the trusted-proxy assumption stops holding -- and the assertion
      # has to reject it. Edits the checkout, which is disposable, and restores it afterwards.
      - name: Injected web/api network merge must fail the deployment contract
        run: |
          # Range-addressed rather than line-numbered, so an unrelated edit to compose.yaml cannot
          # silently move the injection somewhere harmless and turn this proof into a no-op.
          sed -i '/^  web:/,/^  api:/ s/^      - web_edge$/      - web_edge\n      - api_edge/' \
            deploy/compose.yaml
          if git diff --quiet deploy/compose.yaml; then
            echo "::error::The injection did not apply, so this negative test proves nothing."
            exit 1
          fi
          if node .github/scripts/assert-deployment-profile.mjs staging /tmp/profiles/staging.env; then
            echo "::error::A topology placing web and api on one network was accepted."
            git checkout -- deploy/compose.yaml
            exit 1
          fi
          git checkout -- deploy/compose.yaml
          echo "Confirmed: merging the web and api networks is rejected."

      - name: Preflight ships in the production artifact and runs under plain node
        run: |
          pnpm --filter @avenlyo/api build
          pnpm --filter @avenlyo/api smoke:ops-preflight
