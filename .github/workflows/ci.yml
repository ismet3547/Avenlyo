name: CI

on:
  pull_request:
    branches: [main, feat/dynamic-website-knowledge]
  push:
    branches: [main, feat/dynamic-website-knowledge]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  rendered-browser-security:
    name: Rendered browser security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The rendered import runs hostile third-party JavaScript, so its confinement has to be proven
    # by a real browser rather than skipped. This job installs Chromium and fails if it is absent:
    # a silent skip here would mean the WebRTC, private-address, navigation, and resource-bound
    # regressions never ran. It is separate so the ordinary application job stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright-core never downloads a browser, so the binary is provided explicitly here and
      # nowhere else. Ordinary installs and the application job stay free of a Chromium download.
      - name: Install Chromium
        run: pnpm --filter @avenlyo/api exec playwright-core install --with-deps chromium

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and unprivileged user
      # namespaces are exactly what Chromium's sandbox needs to build its own as a non-root user.
      # Without this the sandboxed launch fails on the runner -- and the tempting fix, dropping the
      # sandbox, is the defect this job now exists to catch. So the host capability is enabled and
      # CI runs the same launch configuration production does, sandbox included.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: |
          # Tolerant of the key being absent: which of the two knobs exists is a kernel and
          # distribution detail, and an image that already permits this needs neither. Whether the
          # sandbox actually works is then decided by the suite launching a browser, not by these.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"

      - name: Require a usable Chromium
        run: pnpm --filter @avenlyo/api exec node --input-type=module -e "import { chromium } from 'playwright-core'; import { existsSync } from 'node:fs'; const path = chromium.executablePath(); if (!existsSync(path)) { console.error('Chromium is required for the rendered browser security suite.'); process.exit(1); } console.log('Chromium present.');"

      # Every case here launches through the production launch options, sandbox included, against
      # loopback fixtures: no public website, no DNS, and certificate errors are never ignored. A
      # host that cannot start a sandboxed Chromium fails this job rather than falling back, because
      # falling back is what put unsandboxed hostile JavaScript in the worker process.
      - name: Rendered browser security suite
        run: pnpm vitest run --config vitest.chromium.config.ts --reporter=verbose

      # A skipped security test is a security test that did not run. The suite is required to
      # execute every case, so the guard fails the job if any were skipped.
      - name: Fail if any rendered security test was skipped
        run: pnpm vitest run --config vitest.chromium.config.ts --reporter=json --outputFile=rendered-report.json && node -e "const r=require('./rendered-report.json'); const notRun=r.testResults.flatMap(f=>f.assertionResults).filter(a=>a.status!=='passed'); if(notRun.length||!r.numTotalTests){console.error('Rendered security tests did not all run:', notRun.map(a=>a.title)); process.exit(1);} console.log('All', r.numTotalTests, 'rendered tests executed.');"

  database-security:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: pnpm db:reset

      - name: Run pgTAP security tests
        run: pnpm db:test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  api-production-artifact:
    name: API production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Proves apps/api's real production build -- not `tsx src/server.ts` -- boots under plain Node
    # and shuts down cleanly. No Docker needed for this job; it is the pnpm/Node-only half of the
    # infra validation, kept separate from the Docker-dependent job below so it stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the API production bundle
        run: pnpm --filter @avenlyo/api build

      - name: Confirm the bundle exists
        run: test -f apps/api/dist/server.js && test -f apps/api/dist/scripts/chromium-sandbox-smoke.js

      - name: Artifact boot smoke -- plain Node, /health/live, graceful SIGTERM
        run: pnpm --filter @avenlyo/api smoke:artifact

  hetzner-staging-containers:
    name: Hetzner staging container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Docker-dependent half. Builds the exact images deploy/compose.yaml would run, then proves
    # -- inside the built API image, as its actual non-root runtime user, using the browser it
    # actually ships -- that Chromium launches with the OS sandbox enabled. This is deliberately not
    # the same thing the existing "Rendered browser security" job proves: that job proves the
    # application's launch configuration on a bare GitHub runner; this one proves the final,
    # containerized artifact can do the same thing under Docker's isolation.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same finding as the existing "Rendered browser security" job: Ubuntu 24.04 runners restrict
      # unprivileged user namespaces through AppArmor, which is exactly what Chromium's sandbox needs
      # to build its own as a non-root user. This is a host (runner) kernel setting, independent of
      # Docker's own seccomp profile, and containers share the host kernel -- so it has to be set
      # here too, once, before any container that launches Chromium runs.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"

      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t avenlyo-api:ci .

      # apps/web validates NEXT_PUBLIC_* at build time (apps/web/lib/supabase/config.ts) and fails
      # the build on an empty string, not just a missing one -- Dockerfile.web's ARGs default to ""
      # when nothing is supplied, so `next build` fails page-data collection for /auth/callback
      # without a syntactically valid value here. These are placeholders for validating that the
      # image builds and boots, never real staging configuration -- real values come from
      # deploy/env/build.env on whatever host actually deploys this.
      - name: Build the web image
        run: |
          docker build -f deploy/Dockerfile.web -t avenlyo-web:ci . \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key \
            --build-arg NEXT_PUBLIC_APP_URL=https://staging.avenlyo.com \
            --build-arg NEXT_PUBLIC_AVENLYO_API_URL=https://api-staging.avenlyo.com

      # deploy/compose.yaml's env_file: entries point at /etc/avenlyo/{web,api}.env, which exist
      # only on the real deployment host (Part J: never committed, see deploy/env/*.example).
      # `docker compose config` resolves env_file: paths to validate the file, so it fails here
      # without something at those paths -- these are empty placeholders solely so the runner has
      # the same directory shape a real host does; they carry no configuration of any kind.
      - name: Create placeholder env files for compose config validation
        run: |
          sudo mkdir -p /etc/avenlyo
          sudo touch /etc/avenlyo/web.env /etc/avenlyo/api.env

      - name: Validate compose config
        run: docker compose -f deploy/compose.yaml config

      - name: Assert the API image's runtime user is not root
        run: |
          uid="$(docker run --rm --entrypoint node avenlyo-api:ci -e 'process.stdout.write(String(process.getuid()))')"
          echo "API container UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::API image runs as UID 0 (root)."
            exit 1
          fi

      # This is Part D's mandatory proof: build the final image, run it as the actual non-root
      # runtime user, use the browser path shipped in the image, chromiumSandbox: true, fail (never
      # skip, never retry without the sandbox) if it cannot initialize.
      #
      # Three real failures were found and fixed here in sequence, not assumed away -- each is what
      # deploy/compose.yaml's api service now runs:
      #  1. WITHOUT deploy/chromium-seccomp.json: Docker's default seccomp profile blocks
      #     unprivileged user-namespace creation even with the host kernel sysctl above set, and the
      #     smoke correctly failed closed with "No usable sandbox!" rather than falling back.
      #     deploy/chromium-seccomp.json (Docker's default profile plus Playwright's own documented,
      #     narrow SCMP_ACT_ALLOW for clone/setns/unshare) fixed it. Not `unconfined`.
      #  2. WITHOUT --init: past the seccomp gate, Chromium's namespace sandbox failed a different
      #     way -- `sys_chroot("/proc/self/fdinfo/")` -- because the container's entrypoint (`node`,
      #     which then execs Chromium's zygote) was itself PID 1, and PID 1 gets kernel-level special
      #     treatment that this exact self-referential /proc/self step trips over. Playwright's own
      #     documented Docker recommendation, not a workaround invented here.
      #  3. WITH --cap-drop=ALL: still the identical chroot failure -- proving it was never the
      #     seccomp or PID-1 fix that was insufficient, but that Chromium's own internal
      #     sandbox/zygote setup needs some capability from Docker's default set. Playwright's own
      #     official documented command
      #     (`docker run --ipc=host --user pwuser --security-opt seccomp=seccomp_profile.json ...`)
      #     does not drop capabilities either. Removing --cap-drop=ALL here (Docker's default set,
      #     nothing added beyond it, no SYS_ADMIN) is what made this job pass -- matching upstream's
      #     own tested configuration rather than guessing which single default capability is needed.
      - name: Real sandboxed Chromium launch inside the final API container
        run: |
          docker run --rm \
            --init \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            --shm-size=1gb \
            --entrypoint node \
            avenlyo-api:ci \
            dist/scripts/chromium-sandbox-smoke.js

      - name: API container boots and answers /health/live
        run: |
          docker run -d --name api-ci -p 127.0.0.1:4100:4000 \
            --init \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            --shm-size=1gb \
            -e API_HOST=0.0.0.0 -e API_PORT=4000 -e NODE_ENV=production \
            -e WEB_CHAT_IFRAME_ORIGIN=https://staging.avenlyo.com \
            avenlyo-api:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4100/health/live > /dev/null; then
              echo "API /health/live ok"; docker logs api-ci; docker rm -f api-ci; exit 0
            fi
            sleep 1
          done
          echo "::error::API container never answered /health/live"
          docker logs api-ci
          docker rm -f api-ci
          exit 1

      - name: Web container boots and answers /api/health
        run: |
          docker run -d --name web-ci -p 127.0.0.1:3100:3000 avenlyo-web:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health > /dev/null; then
              echo "web /api/health ok"; docker logs web-ci; docker rm -f web-ci; exit 0
            fi
            sleep 1
          done
          echo "::error::web container never answered /api/health"
          docker logs web-ci
          docker rm -f web-ci
          exit 1
