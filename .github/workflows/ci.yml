name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  rendered-browser-security:
    name: Rendered browser security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The rendered import runs hostile third-party JavaScript, so its confinement has to be proven
    # by a real browser rather than skipped. This job installs Chromium and fails if it is absent:
    # a silent skip here would mean the WebRTC, private-address, navigation, and resource-bound
    # regressions never ran. It is separate so the ordinary application job stays fast.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright-core never downloads a browser, so the binary is provided explicitly here and
      # nowhere else. Ordinary installs and the application job stay free of a Chromium download.
      - name: Install Chromium
        run: pnpm --filter @avenlyo/api exec playwright-core install --with-deps chromium

      - name: Require a usable Chromium
        run: pnpm --filter @avenlyo/api exec node --input-type=module -e "import { chromium } from 'playwright-core'; import { existsSync } from 'node:fs'; const path = chromium.executablePath(); if (!existsSync(path)) { console.error('Chromium is required for the rendered browser security suite.'); process.exit(1); } console.log('Chromium present.');"

      # No public website, no DNS, no petrandevu.com: every fixture is served from loopback, the OS
      # sandbox stays enabled, and certificate errors are never ignored.
      - name: Rendered browser security suite
        run: pnpm vitest run apps/api/src/services/knowledge packages/knowledge/src/rendered --reporter=verbose

      # A skipped security test is a security test that did not run. The suite is required to
      # execute every case, so the guard fails the job if any were skipped.
      - name: Fail if any rendered security test was skipped
        run: pnpm vitest run apps/api/src/services/knowledge --reporter=json --outputFile=rendered-report.json && node -e "const r=require('./rendered-report.json'); const skipped=r.testResults.flatMap(f=>f.assertionResults).filter(a=>a.status!=='passed'); if(skipped.length){console.error('Rendered security tests did not all run:', skipped.map(a=>a.title)); process.exit(1);} console.log('All', r.numTotalTests, 'rendered tests executed.');"

  database-security:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: pnpm db:reset

      - name: Run pgTAP security tests
        run: pnpm db:test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
