# Avenlyo Hetzner staging -- one VM, three containers.
#
#   Internet -> 80/443 -> caddy -> web:3000   (staging.avenlyo.com)
#                               -> api:4000   (api-staging.avenlyo.com)
#
# 3000 and 4000 are never published to the host. Only Caddy is internet-facing; web and api are
# reachable from Caddy purely through Docker's internal DNS (service names), which is also why
# 127.0.0.1:3000 / 127.0.0.1:4000 would be wrong here -- from inside the caddy container, that
# address is the caddy container itself, not web or api.
#
# No Hetzner VM, DNS record, or hosted Supabase migration is touched by this file. `docker compose
# config` validates this file's shape; actually running it against a live host is a separate,
# later, manual step -- see docs/deployment/hetzner-staging.md.

name: avenlyo-staging

# Bounded log rotation, shared by all three services (Part N). json-file is Docker's default driver;
# without max-size/max-file it grows unbounded, which is the actual risk on a small staging disk --
# not the absence of a logging stack, which this deliberately does not add. 10m x 5 files is
# ~50 MB/service ceiling (150 MB across all three), a conservative starting point for staging, not a
# measured figure -- there is no provisioned host to size this against yet. Pino's structured JSON
# output (apps/api) and Next's own stdout (apps/web) are unchanged; this only bounds what Docker
# retains of them on disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # Two ingress networks, not one shared `internal`.
  #
  # The API's trusted-proxy boundary depends on which containers can open a socket to it, so that
  # set has to be the smallest one that works: Caddy, and nothing else. With a single shared network
  # the web container was also an internal peer of api:4000 and could therefore present a forwarding
  # chain the API would trust -- the boundary was really "any private peer", not "the one Caddy hop"
  # it was described as. Splitting the network is what makes that description true.
  #
  # Caddy sits on both. `web` and `api` never share one, so web cannot address api at all; its
  # server-side calls go through Caddy's unpublished internal listener instead (see deploy/Caddyfile
  # and AVENLYO_API_URL in deploy/env/web.env.example).
  #
  # Neither is marked `internal: true`: both containers need outbound internet for Supabase, OpenAI,
  # Stripe, Twilio, and Chromium's own fetches during a rendered import.
  web_edge:
    driver: bridge
  api_edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Build-time only -- see "Build-time vs. runtime configuration" in
        # docs/deployment/hetzner-staging.md. Supplied via `docker compose --env-file
        # deploy/env/build.env build` (untracked; see deploy/env/build.env.example) -- the filename
        # alone does not make Compose load it, the flag is required. Never hardcoded here.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_AVENLYO_API_URL: ${NEXT_PUBLIC_AVENLYO_API_URL:-}
    image: avenlyo-web:${AVENLYO_RELEASE:-local}
    env_file:
      # Server-only runtime configuration. See deploy/env/web.env.example -- the real file is never
      # committed and lives only on the host, at /etc/avenlyo/web.env.
      - /etc/avenlyo/web.env
    environment:
      AVENLYO_RELEASE: ${AVENLYO_RELEASE:-unknown}
      # The web container's server-side path to the API, taken from the deployment profile rather
      # than from /etc/avenlyo/web.env.
      #
      # It used to live in web.env, while `ops:preflight` validated the profile's copy of the same
      # name. Two authorities for one value means preflight could certify `http://caddy:8080` while
      # the running container used something else entirely -- including `http://api:4000`, which is
      # the exact bypass of Phase 19's one-hop trust boundary this value exists to prevent. The
      # value is non-secret, so the fix is to give it one home: the profile.
      #
      # Required substitution, not `${...:-}`: an omitted value must stop the render rather than
      # blank the setting. `environment:` overrides `env_file:`, so a default of "" here would
      # silently unset a value a host's web.env still carried.
      AVENLYO_API_URL: ${AVENLYO_API_URL:?the deployment profile must declare AVENLYO_API_URL}
    expose:
      - "3000"
    networks:
      - web_edge
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A read-only root filesystem was considered for this container too, and deliberately deferred:
    # it is a reasonable hardening step for a plain `next start` process, but this PR cannot run
    # Docker locally to verify every path Next's production server writes to, and this container is
    # not the one carrying the actual security-critical requirement (Chromium's sandbox, on api).
    # Worth revisiting once a real host can prove it, documented in
    # docs/deployment/hetzner-staging.md rather than guessed at here.
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: avenlyo-api:${AVENLYO_RELEASE:-local}
    env_file:
      # Server-only runtime configuration, including the Supabase service-role key and every
      # provider secret -- never in web.env. See deploy/env/api.env.example.
      - /etc/avenlyo/api.env
    environment:
      AVENLYO_RELEASE: ${AVENLYO_RELEASE:-unknown}
      # The non-secret public deployment profile, passed in so `ops:preflight` can actually check
      # the agreements it claims to check.
      #
      # The API's own behaviour does not read any of these -- it has API_CORS_ORIGIN and
      # WEB_CHAT_IFRAME_ORIGIN in api.env for that. They are here as declared deployment facts, so
      # the trusted preflight process can compare the browser-facing half of the profile against
      # the server-facing half and catch a CORS origin that has drifted from the app origin, a
      # compiled bundle pointing at a hostname Caddy does not serve, or a web container configured
      # to reach the API without crossing Caddy.
      #
      # They come from the SAME --env-file the build and the rest of this file already read, which
      # is the point: a separate file for preflight to read would be a second source of truth, and
      # preflight would end up validating a profile the deployment did not use.
      #
      # Every value here is non-secret and safe in a process listing. No key, token, or anon key
      # belongs in this block.
      #
      # AVENLYO_DEPLOYMENT_ENV itself is deliberately NOT here. Compose's `environment:` overrides
      # `env_file:`, so listing it would replace the identity api.env supplies -- turning a working
      # deployment into one that refuses to boot. The runtime identity stays in api.env, next to
      # NODE_ENV, where both are read together.
      #
      # Instead the profile's own declared identity is mirrored under a distinct name, so preflight
      # can compare the two files rather than let one silently overwrite the other. Required
      # substitution: a deployed profile that declares no identity must stop the render.
      AVENLYO_PROFILE_DEPLOYMENT_ENV: ${AVENLYO_DEPLOYMENT_ENV:?the deployment profile must declare AVENLYO_DEPLOYMENT_ENV}
      #
      # The remaining profile values are required by the preflight contract
      # (REQUIRED_DEPLOYED_PROFILE_SETTINGS in packages/shared), but are passed with `:-` rather than
      # `:?` on purpose: an operator who omits one should get a bounded preflight finding naming the
      # setting, not an opaque Compose interpolation error. env.ts treats "" as absent so the
      # omission reaches the policy as an omission.
      AVENLYO_PROFILE_API_HOST: ${AVENLYO_API_HOST:-}
      AVENLYO_PROFILE_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      AVENLYO_PROFILE_PUBLIC_API_URL: ${NEXT_PUBLIC_AVENLYO_API_URL:-}
      AVENLYO_PROFILE_WEB_API_URL: ${AVENLYO_API_URL:-}
      AVENLYO_PROFILE_WEB_HOST: ${AVENLYO_WEB_HOST:-}
    expose:
      - "4000"
    networks:
      - api_edge
    restart: unless-stopped
    # Without this, `node dist/server.js` is the container's own PID 1, and PID 1 gets kernel-level
    # special treatment that breaks a specific step of Chromium's namespace sandbox setup (a
    # self-referential /proc/self chroot) -- proven by this PR's own CI, and Playwright's own
    # documented Docker recommendation for exactly this reason, not a guess.
    init: true
    # cap_drop: [ALL] was tried first, per Part C's preference, and proven incompatible by this PR's
    # own CI: with every capability dropped, Chromium's own internal sandbox/zygote setup failed a
    # step unrelated to the seccomp or PID-1 fixes above (a chroot during namespace setup), and it
    # passed as soon as capabilities were restored to Docker's default set -- with the seccomp
    # profile and no-new-privileges below unchanged. That default set is exactly what Playwright's
    # own official Docker documentation runs and tests
    # (`docker run --ipc=host --user pwuser --security-opt seccomp=seccomp_profile.json ...`, no
    # cap_drop at all); this repository does not narrow further than that, matching upstream's own
    # tested configuration rather than guessing at which single default capability Chromium's
    # namespace setup needs. No capability is *added* beyond Docker's default -- nothing here grants
    # SYS_ADMIN or any capability Docker does not already include by default.
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile blocks unprivileged user-namespace creation, which is
      # exactly what Chromium's sandbox needs -- proven by this PR's own CI, which failed closed
      # with "No usable sandbox!" under the default profile before this was added. This file is
      # Docker's default profile plus one narrow, explicit addition (unconditional SCMP_ACT_ALLOW
      # for clone/setns/unshare), copied verbatim from Playwright's own
      # microsoft/playwright/utils/docker/seccomp_profile.json -- not `unconfined`, and no
      # capability is added: unprivileged user namespaces require none, by kernel design.
      - seccomp:./chromium-seccomp.json
    # A bounded /dev/shm, not the host's IPC namespace. Chromium uses shared memory heavily for
    # tab/renderer processes; the default 64MB Docker gives a container is not enough and the
    # common workaround (`ipc: host`) shares the host's IPC namespace with every other process on
    # it, which is a far larger exposure than this workload needs. A sized tmpfs-backed /dev/shm
    # solves the same problem without it.
    shm_size: "1gb"
    # Chromium's browser cache and any other renderer scratch space; not business data, discarded on
    # container restart, and deliberately not read_only here -- Chromium genuinely needs writable
    # paths beyond /tmp (its own profile/cache directories), unlike the web container.
    mem_limit: 2g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    # Pinned to a specific minor line, not `latest` or a bare major tag. Bump deliberately; see
    # docs/deployment/hetzner-staging.md for how.
    image: caddy:2.8-alpine
    environment:
      # The two public hostnames deploy/Caddyfile substitutes. Deployment configuration, not a
      # trusted destination: the upstreams in the Caddyfile are literals and cannot be overridden.
      # Defaulting to the staging names keeps this file a no-op for the running deployment.
      AVENLYO_WEB_HOST: ${AVENLYO_WEB_HOST:-staging.avenlyo.com}
      AVENLYO_API_HOST: ${AVENLYO_API_HOST:-api-staging.avenlyo.com}
    ports:
      # Still the only service publishing anything, and still only these three. Caddy's internal
      # :8080 listener is absent here on purpose -- that is what keeps it unreachable from the host.
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Only Caddy's own certificate/state data persists. No application data, no logs with
      # business content, ever lands in a volume.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_edge
      - api_edge
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      # The two capabilities Caddy documents needing to bind 80/443 as a non-root-equivalent
      # process and to open enough file descriptors for many concurrent connections -- not a broad
      # grant, and not SYS_ADMIN.
      - NET_BIND_SERVICE
      - CHOWN
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
